name: fuzz

# Every fuzz target, nightly, for longer than CI can spend on a push. A
# failure uploads the input that found it; commit it under the target's
# testdata/fuzz directory so go test replays it from then on.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ".", name: FuzzParse }
          - { pkg: ".", name: FuzzDecodeGraph }
          - { pkg: ".", name: FuzzDecodeMetadata }
          - { pkg: ".", name: FuzzDecodeTraining }
          - { pkg: "./importer", name: FuzzParseONNX }
          - { pkg: "./importer", name: FuzzParseGGUF }
          - { pkg: "./importer", name: FuzzParseSafetensors }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: fuzz ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 10m ${{ matrix.target.pkg }}

      - name: keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}-crashers
          path: "**/testdata/fuzz/${{ matrix.target.name }}/"
