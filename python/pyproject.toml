[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmf"
version = "0.1.0"
description = "A reader and executor for mmf model files, written from the specification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["mmf"]
