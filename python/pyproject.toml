[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mim"
version = "0.1.0"
description = "A reader and executor for mim model files, written from the specification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.6"]

[tool.setuptools]
packages = ["mim"]
